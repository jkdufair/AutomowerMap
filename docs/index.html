<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Cycling Route Planner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:      #111827;
      --surface: #1f2937;
      --border:  #374151;
      --text:    #f3f4f6;
      --muted:   #9ca3af;
      --red:     #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    /* Lock the page to the viewport: no document scroll, no horizontal
       overflow that would clip the title/controls at the edges. */
    html, body {
      height: 100%; width: 100%;
      position: fixed; inset: 0; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* --app-height is set from JS to window.visualViewport.height so the
       layout exactly fills the *visible* area, never hidden behind Safari's
       toolbar. Falls back to 100dvh, then 100vh, on older browsers. */
    #app {
      display: flex; flex-direction: column;
      width: 100%;
      height: 100vh; height: 100dvh; height: var(--app-height, 100dvh);
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 11px 16px; display: flex; align-items: center; gap: 10px;
      flex-shrink: 0; z-index: 10;
    }
    #topbar h1 { font-size: 1rem; font-weight: 700; color: #34d399; flex: 1; }
    #gear-btn { background: none; border: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; padding: 4px; line-height: 1; }

    /* ── Map ── */
    #map { flex: 1; min-height: 0; }

    /* ── Bottom panel ── */
    #bottom-panel {
      background: var(--surface); border-top: 1px solid var(--border);
      flex-shrink: 0; max-height: 58dvh; overflow-y: auto;
      display: flex; flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom); /* clear home indicator */
    }

    /* ── Controls ── */
    #controls { padding: 13px 16px 10px; display: flex; flex-direction: column; gap: 11px; flex-shrink: 0; }
    .row { display: flex; align-items: center; gap: 10px; }
    .dist-label { font-size: 1rem; font-weight: 700; color: #34d399; min-width: 56px; text-align: right; }
    input[type=range] {
      flex: 1; -webkit-appearance: none; height: 6px;
      background: var(--border); border-radius: 3px; outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 26px; height: 26px;
      background: #34d399; border-radius: 50%; cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,.4);
    }
    input[type=range]::-moz-range-thumb {
      width: 26px; height: 26px; background: #34d399;
      border-radius: 50%; cursor: pointer; border: none;
    }
    .btn-row { display: flex; gap: 8px; }
    button.primary {
      flex: 1; background: #34d399; color: #111; border: none;
      border-radius: 10px; padding: 13px; font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    button.primary:active { background: #059669; }
    button.primary:disabled { background: #1f4d39; color: #0f2c22; cursor: not-allowed; }

    /* ── Status ── */
    #status { padding: 6px 16px 4px; font-size: 0.83rem; color: var(--muted); min-height: 26px; line-height: 1.4; flex-shrink: 0; }
    #status.err { color: var(--red); }
    #status.ok  { color: #34d399; }

    /* ── Route cards ── */
    #route-list {
      display: none; flex-direction: row; gap: 8px;
      padding: 8px 16px 10px; overflow-x: auto;
      -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory;
      flex-shrink: 0; border-bottom: 1px solid var(--border);
    }
    #route-list::-webkit-scrollbar { display: none; }

    .route-card {
      flex-shrink: 0; width: 100px; scroll-snap-align: start;
      background: var(--bg); border: 2px solid var(--border);
      border-radius: 10px; padding: 9px 10px; cursor: pointer;
    }
    .route-card.active { background: rgba(52,211,153,.08); }

    .rc-dot {
      width: 20px; height: 20px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 800; color: #111; margin-bottom: 7px;
    }
    .rc-dist { font-size: 1rem; font-weight: 700; line-height: 1; }
    .rc-gain { font-size: 0.75rem; color: var(--muted); margin-top: 3px; }
    .rc-tag  { font-size: 0.65rem; margin-top: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

    /* ── Stats ── */
    #stats-row {
      display: none; grid-template-columns: repeat(3, 1fr);
      gap: 1px; background: var(--border); flex-shrink: 0;
    }
    .stat-cell { background: var(--surface); padding: 9px 6px; text-align: center; }
    .stat-cell .sv { font-size: 1rem; font-weight: 700; }
    .stat-cell .sl { font-size: 0.67rem; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: .04em; }

    /* ── Elevation chart ── */
    #elev-section { display: none; padding: 10px 16px 4px; flex-shrink: 0; }
    #elev-section h3 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 7px; }
    #chart-wrap { height: 90px; position: relative; }

    /* ── Download ── */
    #dl-section { display: none; padding: 10px 16px 16px; flex-shrink: 0; }
    #dl-section button {
      width: 100%; background: none; border: 2px solid #34d399; color: #34d399;
      border-radius: 10px; padding: 13px; font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    #dl-section button:active { background: #0f2d22; }

    /* ── Settings screen — app is hidden when this is open ── */
    #settings-overlay {
      display: none; height: 100%; background: var(--bg); overflow-y: auto;
    }
    #settings-overlay.open { display: block; }
    #settings-sheet {
      max-width: 480px; margin: 0 auto;
      padding: 24px 20px 48px;
    }
    #settings-sheet h2 { font-size: 1rem; margin-bottom: 16px; }
    #settings-sheet label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; }
    #settings-sheet input[type=text] {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 12px;
      font-size: 0.9rem; font-family: monospace; outline: none;
    }
    #settings-sheet input[type=text]:focus { border-color: #34d399; }
    #settings-sheet a { color: #34d399; font-size: 0.8rem; }
    #settings-sheet p { font-size: 0.78rem; color: var(--muted); margin-top: 8px; line-height: 1.5; }

    .compare-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .compare-row label { font-size: 0.82rem; color: var(--muted); }
    .seg-ctrl { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .seg-ctrl button {
      flex: 1; background: none; border: none; color: var(--muted);
      padding: 9px 14px; font-size: 0.9rem; cursor: pointer;
    }
    .seg-ctrl button.active { background: #34d399; color: #111; font-weight: 700; }

    .sheet-close {
      display: block; margin-top: 18px; width: 100%;
      background: #34d399; color: #111; border: none;
      border-radius: 10px; padding: 14px; font-size: 1rem; font-weight: 700; cursor: pointer;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; width: 16px; height: 16px; border: 2px solid #34d399; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-left: 6px; }
  </style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>Cycling Route Planner</h1>
    <button id="gear-btn" onclick="openSettings()" title="Settings">⚙︎</button>
  </div>

  <div id="map"></div>

  <div id="bottom-panel">
    <div id="controls">
      <div class="row">
        <span style="font-size:.85rem;color:var(--muted);white-space:nowrap">Distance</span>
        <input type="range" id="dist-slider" min="10" max="70" step="5" value="30" oninput="updateDistLabel()">
        <span class="dist-label" id="dist-label">30 mi</span>
      </div>
      <div class="btn-row">
        <button class="primary" id="gen-btn" onclick="generateRoutes()">Generate Routes</button>
      </div>
    </div>

    <div id="status">Tap ⚙︎ to enter your API key, then Generate Routes.</div>

    <!-- All route options as tappable cards -->
    <div id="route-list"></div>

    <!-- Stats for selected route -->
    <div id="stats-row">
      <div class="stat-cell"><div class="sv" id="s-dist">—</div><div class="sl">Miles</div></div>
      <div class="stat-cell"><div class="sv" id="s-up">—</div>  <div class="sl">Elev Gain</div></div>
      <div class="stat-cell"><div class="sv" id="s-time">—</div><div class="sl">Est Time</div></div>
    </div>

    <div id="elev-section">
      <h3>Elevation Profile</h3>
      <div id="chart-wrap"><canvas id="elev-canvas"></canvas></div>
    </div>

    <div id="dl-section">
      <button onclick="downloadGPX()">⬇ Download GPX → import to Ride with GPS</button>
    </div>
  </div>
</div>

<!-- Settings sheet -->
<div id="settings-overlay" onclick="maybeCloseSettings(event)">
  <div id="settings-sheet">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <button onclick="closeSettings()" style="background:none;border:none;color:var(--muted);font-size:1.5rem;cursor:pointer;padding:0;line-height:1">←</button>
      <h2 style="margin:0">Settings</h2>
    </div>
    <label for="key-input">OpenRouteService API Key</label>
    <input type="text" id="key-input" placeholder="Paste your free key here" oninput="saveKey()">
    <p>Free key — 2,000 routes/day, no card required:<br>
       <a href="https://openrouteservice.org/dev/#/signup" target="_blank">openrouteservice.org/dev/#/signup →</a></p>
    <div class="compare-row">
      <label>Compare</label>
      <div class="seg-ctrl" id="compare-ctrl">
        <button onclick="setCompare(3,this)">3 routes</button>
        <button onclick="setCompare(5,this)" class="active">5 routes</button>
        <button onclick="setCompare(8,this)">8 routes</button>
      </div>
    </div>
    <button class="sheet-close" onclick="closeSettings()">Done</button>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const HOME_LAT = 42.6074567;
const HOME_LNG = -76.9277306;

const ROUTE_COLORS = ['#34d399','#60a5fa','#fbbf24','#c084fc','#fb7185','#2dd4bf','#fb923c','#e879f9'];

// ── State ─────────────────────────────────────────────────────────────────────
let routes = [], selectedIdx = 0, numCompare = 5;
let polylines = [], routeLayer, elevChart;

// ── Map ───────────────────────────────────────────────────────────────────────
const map = L.map('map', { center: [HOME_LAT, HOME_LNG], zoom: 11 });

// Frame the map to roughly the area a loop of `miles` will cover, centred
// on home. A loop of distance D has radius ~D/(2π); real routes wander, so
// we pad by 1.5x. Keeps the home dot centred with sensible context.
function previewExtent(miles) {
  const radiusMi  = (miles / (2 * Math.PI)) * 1.5;
  const dLat      = radiusMi / 69;                                  // ~69 mi per ° lat
  const dLng      = radiusMi / (69 * Math.cos(HOME_LAT * Math.PI / 180));
  map.fitBounds([
    [HOME_LAT - dLat, HOME_LNG - dLng],
    [HOME_LAT + dLat, HOME_LNG + dLng],
  ], { animate: false });
}
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://openstreetmap.org/copyright">OSM</a>', maxZoom: 19
}).addTo(map);

L.marker([HOME_LAT, HOME_LNG], {
  icon: L.divIcon({
    className: '',
    html: '<div style="width:14px;height:14px;background:#34d399;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.6)"></div>',
    iconSize: [14,14], iconAnchor: [7,7]
  })
}).addTo(map).bindPopup('<b>Home</b>');

routeLayer = L.layerGroup().addTo(map);

// ── Visual-viewport height sync ───────────────────────────────────────────────
// iOS Safari's toolbar overlaps the layout viewport; visualViewport.height is
// the genuinely visible height. Sync it to a CSS var and re-layout the map.
function setAppHeight() {
  const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  document.documentElement.style.setProperty('--app-height', h + 'px');
  if (map) map.invalidateSize();
}
setAppHeight();
window.addEventListener('resize', setAppHeight);
window.addEventListener('orientationchange', () => setTimeout(setAppHeight, 200));
if (window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);

// ── Settings ──────────────────────────────────────────────────────────────────
function loadKey()    { return localStorage.getItem('ors_key') || ''; }
function saveKey()    { const k = document.getElementById('key-input').value.trim(); if (k) localStorage.setItem('ors_key', k); }
function openSettings()  {
  document.getElementById('app').style.display = 'none';
  document.getElementById('settings-overlay').classList.add('open');
  document.getElementById('key-input').value = loadKey();
}
function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('open');
  document.getElementById('app').style.display = 'flex';
  map.invalidateSize(); // re-render map after it was hidden
}
function maybeCloseSettings(e) { /* full-screen overlay — close via Done button only */ }
function setCompare(n, btn) {
  numCompare = n;
  document.querySelectorAll('#compare-ctrl button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
document.getElementById('key-input').value = loadKey();

function updateDistLabel() {
  const miles = parseInt(document.getElementById('dist-slider').value);
  document.getElementById('dist-label').textContent = miles + ' mi';
  // Only re-frame while no routes are drawn (otherwise keep the route in view)
  if (!routes.length) previewExtent(miles);
}

// Frame the initial view to the default distance
previewExtent(parseInt(document.getElementById('dist-slider').value));

// ── UI helpers ────────────────────────────────────────────────────────────────
function setStatus(msg, cls = '') {
  const el = document.getElementById('status');
  el.innerHTML = msg;
  el.className = cls;
}
function setBusy(busy) {
  const btn = document.getElementById('gen-btn');
  btn.disabled = busy;
  btn.innerHTML = busy ? 'Finding routes… <span class="spin"></span>' : 'Generate Routes';
}

// ── ORS API ───────────────────────────────────────────────────────────────────
async function fetchRoute(key, meters, seed) {
  const res = await fetch('https://api.openrouteservice.org/v2/directions/cycling-road/geojson', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': key },
    body: JSON.stringify({
      coordinates: [[HOME_LNG, HOME_LAT]],
      options: {
        round_trip: { length: meters, points: 5, seed },
        // cycling profiles only accept 'ferries'/'steps' here — 'highways'
        // is a driving-only feature and 400s the request. The cycling-road
        // profile already weights quiet roads over busy arterials.
        avoid_features: ['ferries']
      },
      elevation: true,
      instructions: false
    })
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error?.message || `HTTP ${res.status}`);
  }
  return res.json();
}

// ── Scoring ───────────────────────────────────────────────────────────────────
function circularity(coords) {
  if (coords.length < 2) return 0;
  const maxD = Math.max(...coords.map(c => {
    const dx = (c[0] - HOME_LNG) * Math.cos(HOME_LAT * Math.PI / 180) * 111.32;
    const dy = (c[1] - HOME_LAT) * 111.32;
    return Math.sqrt(dx*dx + dy*dy);
  }));
  let km = 0;
  for (let i = 1; i < coords.length; i++) {
    const dx = (coords[i][0]-coords[i-1][0]) * Math.cos(HOME_LAT*Math.PI/180) * 111.32;
    const dy = (coords[i][1]-coords[i-1][1]) * 111.32;
    km += Math.sqrt(dx*dx + dy*dy);
  }
  const idealR = km / (2 * Math.PI);
  return Math.min(maxD, idealR) / Math.max(maxD, idealR);
}

// ── Generate ──────────────────────────────────────────────────────────────────
async function generateRoutes() {
  const key = loadKey();
  if (!key) { setStatus('Tap ⚙︎ to add your API key first.', 'err'); openSettings(); return; }

  const miles  = parseInt(document.getElementById('dist-slider').value);
  const meters = Math.round(miles * 1609.344);
  const seeds  = Array.from({ length: numCompare }, (_, i) => i * 17 + 3);

  routes = []; polylines = []; selectedIdx = 0;
  setBusy(true);
  routeLayer.clearLayers();
  document.getElementById('route-list').style.display = 'none';
  document.getElementById('stats-row').style.display  = 'none';
  document.getElementById('elev-section').style.display = 'none';
  document.getElementById('dl-section').style.display = 'none';

  let done = 0, lastErr = '';
  for (const seed of seeds) {
    done++;
    setStatus(`Fetching option ${done} of ${numCompare}…`);
    try {
      const gj      = await fetchRoute(key, meters, seed);
      const feature = gj.features[0];
      const s       = feature.properties.summary;
      const coords  = feature.geometry.coordinates;
      const aFt     = s.ascent * 3.28084;
      const circ    = circularity(coords);
      routes.push({
        feature, seed,
        distMi:   s.distance / 1609.344,
        ascentFt: aFt,
        descentFt: s.descent * 3.28084,
        durationS: s.duration,
        circ,
        score: aFt + (1 - circ) * aFt * 0.3,
      });
    } catch (e) {
      lastErr = e.message;
      console.warn('seed', seed, e.message);
    }
  }

  setBusy(false);
  if (!routes.length) { setStatus(`All requests failed: ${lastErr || 'check your API key.'}`, 'err'); return; }

  routes.sort((a, b) => a.score - b.score);
  selectedIdx = 0;
  renderAll();
}

// ── Draw all routes ───────────────────────────────────────────────────────────
function renderAll() {
  routeLayer.clearLayers();
  polylines = [];

  routes.forEach((r, i) => {
    const color = ROUTE_COLORS[i % ROUTE_COLORS.length];
    const isSelected = i === selectedIdx;
    const ll = r.feature.geometry.coordinates.map(c => [c[1], c[0]]);
    const pl = L.polyline(ll, {
      color,
      weight:  isSelected ? 5 : 2,
      opacity: isSelected ? 0.95 : 0.3,
    }).addTo(routeLayer);
    pl.on('click', () => selectRoute(i));
    if (isSelected) pl.bringToFront();
    polylines.push(pl);
  });

  // Fit to all routes combined
  const allLL = routes.flatMap(r => r.feature.geometry.coordinates.map(c => [c[1], c[0]]));
  map.fitBounds(L.latLngBounds(allLL), { padding: [28, 28] });

  buildRouteCards();
  showSelected();
}

// ── Route cards ───────────────────────────────────────────────────────────────
function buildRouteCards() {
  const list = document.getElementById('route-list');
  list.innerHTML = '';
  routes.forEach((r, i) => {
    const color = ROUTE_COLORS[i % ROUTE_COLORS.length];
    const tag   = i === 0 ? 'Flattest' : i === 1 ? '2nd' : i === 2 ? '3rd' : `${i+1}th`;
    const card  = document.createElement('div');
    card.className = 'route-card' + (i === selectedIdx ? ' active' : '');
    card.style.borderColor = i === selectedIdx ? color : 'var(--border)';
    card.innerHTML = `
      <div class="rc-dot" style="background:${color}">${i+1}</div>
      <div class="rc-dist">${r.distMi.toFixed(1)} mi</div>
      <div class="rc-gain">+${Math.round(r.ascentFt)} ft</div>
      <div class="rc-tag" style="color:${color}">${tag}</div>`;
    card.onclick = () => selectRoute(i);
    list.appendChild(card);
  });
  list.style.display = 'flex';
}

// ── Select a route ────────────────────────────────────────────────────────────
function selectRoute(i) {
  selectedIdx = i;
  const color = ROUTE_COLORS[i % ROUTE_COLORS.length];

  // Update polyline styles
  polylines.forEach((pl, j) => {
    pl.setStyle({ weight: j === i ? 5 : 2, opacity: j === i ? 0.95 : 0.3 });
    if (j === i) pl.bringToFront();
  });

  // Update cards
  document.querySelectorAll('.route-card').forEach((el, j) => {
    el.classList.toggle('active', j === i);
    el.style.borderColor = j === i ? ROUTE_COLORS[j % ROUTE_COLORS.length] : 'var(--border)';
  });

  showSelected();
}

// ── Show stats for selected route ─────────────────────────────────────────────
function fmtTime(s) {
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  return h ? `${h}h ${m.toString().padStart(2,'0')}m` : `${m}m`;
}

function showSelected() {
  const r = routes[selectedIdx];
  const color = ROUTE_COLORS[selectedIdx % ROUTE_COLORS.length];

  document.getElementById('s-dist').textContent  = r.distMi.toFixed(1);
  document.getElementById('s-dist').style.color  = color;
  document.getElementById('s-up').textContent    = `+${Math.round(r.ascentFt)}ft`;
  document.getElementById('s-up').style.color    = color;
  document.getElementById('s-time').textContent  = fmtTime(r.durationS);
  document.getElementById('s-time').style.color  = color;
  document.getElementById('stats-row').style.display = 'grid';

  const coords = r.feature.geometry.coordinates;
  if (coords[0]?.length >= 3) {
    drawElevation(coords, color);
    document.getElementById('elev-section').style.display = 'block';
  } else {
    document.getElementById('elev-section').style.display = 'none';
  }
  document.getElementById('dl-section').style.display = 'block';

  const note = selectedIdx === 0 ? ' — flattest + most circular' : '';
  setStatus(`Route ${selectedIdx + 1} of ${routes.length}: ${r.distMi.toFixed(1)} mi · +${Math.round(r.ascentFt)} ft${note}`, 'ok');
}

// ── Elevation chart ───────────────────────────────────────────────────────────
function drawElevation(coords, color) {
  const MAX  = 150;
  const step = Math.max(1, Math.floor(coords.length / MAX));
  const pts  = coords.filter((_, i) => i % step === 0);
  let cum = 0;
  const xs = pts.map((c, i) => {
    if (i > 0) {
      const dx = (c[0]-pts[i-1][0]) * Math.cos(HOME_LAT*Math.PI/180) * 111.32 * 0.621371;
      const dy = (c[1]-pts[i-1][1]) * 111.32 * 0.621371;
      cum += Math.sqrt(dx*dx + dy*dy);
    }
    return cum.toFixed(1);
  });
  const ys = pts.map(c => Math.round(c[2] * 3.28084));
  const hex = color + '30'; // 18% alpha fill

  if (elevChart) elevChart.destroy();
  elevChart = new Chart(document.getElementById('elev-canvas').getContext('2d'), {
    type: 'line',
    data: {
      labels: xs,
      datasets: [{ data: ys, borderColor: color, backgroundColor: hex,
        borderWidth: 1.5, pointRadius: 0, fill: true, tension: 0.3 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: c => `${c.parsed.y} ft`, title: c => `${c[0].label} mi` }
      }},
      scales: {
        x: { ticks: { color: '#6b7280', maxTicksLimit: 5, callback: v => `${v}mi` }, grid: { color: '#1f2937' } },
        y: { ticks: { color: '#6b7280', callback: v => `${v}ft` }, grid: { color: '#1f2937' } }
      }
    }
  });
}

// ── GPX export ────────────────────────────────────────────────────────────────
function downloadGPX() {
  const r      = routes[selectedIdx];
  const coords = r.feature.geometry.coordinates;
  const name   = `Cycling ${r.distMi.toFixed(1)}mi (+${Math.round(r.ascentFt)}ft)`;
  const now    = new Date().toISOString();

  const trkpts = coords.map(c => {
    const ele = c.length >= 3 ? `\n        <ele>${c[2].toFixed(1)}</ele>` : '';
    return `      <trkpt lat="${c[1].toFixed(7)}" lon="${c[0].toFixed(7)}">${ele}\n      </trkpt>`;
  }).join('\n');

  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Cycling Route Planner"
     xmlns="http://www.topografix.com/GPX/1/1">
  <metadata><name>${name}</name><time>${now}</time></metadata>
  <trk><name>${name}</name><trkseg>
${trkpts}
  </trkseg></trk>
</gpx>`;

  const a = Object.assign(document.createElement('a'), {
    href:     URL.createObjectURL(new Blob([gpx], { type: 'application/gpx+xml' })),
    download: `cycling_${Math.round(r.distMi)}mi.gpx`
  });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
</script>
